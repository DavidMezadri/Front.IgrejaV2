version: '3.8'

services:
  # Frontend React
  frontend:
    image: ghcr.io/seu-usuario/front-igrejav2:latest
    container_name: igrejav2-frontend
    restart: always
    expose:
      - "3000"
    networks:
      - igrejav2-network
    environment:
      - VITE_API_URL=http://localhost:8080

  # Backend .NET (ajuste conforme necessário)
  # backend:
  #   image: ghcr.io/seu-usuario/igrejav2-api:latest
  #   container_name: igrejav2-backend
  #   restart: always
  #   expose:
  #     - "8080"
  #   networks:
  #     - igrejav2-network
  #   environment:
  #     - ASPNETCORE_URLS=http://+:8080
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - CONNECTIONSTRING_DEFAULT=Server=seu-db...

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: igrejav2-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - igrejav2-network
    depends_on:
      - frontend

networks:
  igrejav2-network:
    driver: bridge
